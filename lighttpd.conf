# lighttpd config for Raspberry Pi 5 Network Install
# Copy to /etc/lighttpd/lighttpd.conf (or include from there)

server.modules = (
    "mod_access",
    "mod_alias",
    "mod_accesslog",
    "mod_staticfile",
)

server.document-root        = "/srv/netinstall/www"
server.upload-dirs          = ("/var/cache/lighttpd/uploads")
server.errorlog             = "/var/log/lighttpd/error.log"
server.breakagelog          = "/var/log/lighttpd/breakage.log"
accesslog.filename          = "/var/log/lighttpd/access.log"
server.stat-cache-engine    = "simple"
server.max-connections      = 1024

server.port                 = 80
server.bind                 = "0.0.0.0"

# boot.img and boot.sig are served from /srv/netinstall/boot/
# accessed as http://<server>/boot/boot.img
alias.url = (
    "/boot/" => "/srv/netinstall/boot/",
)

# OS images (optional, for offline mode)
# Store images in /srv/netinstall/images/
# alias.url += ( "/images/" => "/srv/netinstall/images/" )

# MIME types
mimetype.assign = (
    ".img"  => "application/octet-stream",
    ".sig"  => "application/octet-stream",
    ".xz"   => "application/x-xz",
    ".json" => "application/json",
    ".txt"  => "text/plain",
    ""      => "application/octet-stream",
)

# Disable directory listing
dir-listing.activate = "disable"
